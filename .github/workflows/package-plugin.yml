name: Package ESDS Android plugin
on:
  push:
    branches:
      - feature/palette-system-0.9.32
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate palette contract
        run: node tests/palette-contract.test.js
      - name: Check JavaScript syntax
        run: node --check main.js
      - name: Package Obsidian plugin
        run: |
          mkdir -p dist
          zip -j dist/ESDS-0.9.32.zip main.js styles.css manifest.json
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ESDS-0.9.32-Android
          path: dist/ESDS-0.9.32.zip
          if-no-files-found: error
          retention-days: 90
